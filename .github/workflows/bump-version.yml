name: Bump Version

# On push to main, auto-bump patch version via a bump branch + PR.
# Skips commits with [bump] or [skip ci] to prevent infinite loops.
# For minor/major bumps, manually edit the version in SKILL.md frontmatter.

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    if: |
      ! contains(github.event.head_commit.message, '[skip ci]') &&
      ! contains(github.event.head_commit.message, '[bump]')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VER=$(awk '/^---/{f++; next} f==1 && /^version:/{print $2; exit}' SKILL.md)
          echo "current=$VER" >> $GITHUB_OUTPUT
          echo "current: $VER"

      - name: Bump patch version
        run: bash scripts/bump-version.sh patch

      - name: Read new version
        id: newver
        run: |
          VER=$(awk '/^---/{f++; next} f==1 && /^version:/{print $2; exit}' SKILL.md)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "new: $VER"

      - name: Create bump PR and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.newver.outputs.version }}
          OLD: ${{ steps.version.outputs.current }}
        run: |
          BRANCH="bump/v${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add SKILL.md
          git commit -m "chore: bump version ${OLD} → ${NEW} [bump][skip ci]"
          git tag "v${NEW}"
          git push origin "$BRANCH" --tags

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version ${OLD} → ${NEW} [bump]" \
            --body "Auto-bump patch version after merge to main.

          | From | To |
          |------|----|
          | **${OLD}** | **${NEW}** |

          Tag \`v${NEW}\` already exists — merging this PR keeps \`main\` in sync." \
            --label "bump"
